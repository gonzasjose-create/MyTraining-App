<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <meta name="format-detection" content="telephone=no">
  <title>Treino</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="topo"><a href="#/" id="marca" class="marca">Treino</a></div>
  <div id="banner-treino" class="banner-treino" role="status" hidden></div>
  <main id="app"><p class="centro ajuda">A carregar…</p></main>
  <nav class="nav" aria-label="Navegação principal">
    <a href="#/"><span aria-hidden="true">⌂</span>Painel</a>
    <a href="#/agenda"><span aria-hidden="true">▦</span>Agenda</a>
    <a href="#/clientes"><span aria-hidden="true">☰</span>Clientes</a>
    <a href="#/treino"><span aria-hidden="true">▤</span>Treino</a>
    <a href="#/definicoes"><span aria-hidden="true">⚙</span>Definições</a>
  </nav>
  <script src="lib/sql-wasm.js"></script>
  <script src="lib/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // Diagnóstico: se a app não arrancar em 8 s, verifica que ficheiros faltam no servidor
    // (caso típico: pastas css/js/lib/icons não enviadas para o GitHub).
    setTimeout(async function () {
      var main = document.getElementById('app');
      if (!main || main.textContent.indexOf('A carregar') === -1) return;
      var ficheiros = ['css/app.css', 'js/app.js', 'js/db.js', 'js/views/painel.js', 'lib/sql-wasm.js', 'lib/sql-wasm.wasm', 'lib/chart.umd.js', 'icons/icon-180.png'];
      var faltam = [];
      for (var i = 0; i < ficheiros.length; i++) {
        try { var r = await fetch(ficheiros[i], { method: 'HEAD', cache: 'no-store' }); if (!r.ok) faltam.push(ficheiros[i]); }
        catch (e) { faltam.push(ficheiros[i]); }
      }
      main.innerHTML = faltam.length
        ? '<h2>A app não arrancou: faltam ficheiros no servidor</h2><p>Não encontrei:</p><ul><li>' + faltam.join('</li><li>') +
          '</li></ul><p>Envia para o GitHub as <strong>pastas</strong> css, js, lib e icons (com o mesmo nome e no mesmo nível do index.html).</p>'
        : '<h2>A app não arrancou</h2><p>Os ficheiros existem, mas houve um erro ao iniciar. Atualiza o iOS/Safari e volta a abrir. ' +
          'Se continuar, envia uma captura desta mensagem.</p>';
    }, 8000);
  </script>
</body>
</html>
